<div class="orderHistory">
    <p-table [value]="orders">
    <ng-template #header>
        <tr>
            <th>Order ID</th>
            <th>Movie</th>
            <th>Number of Tickets</th>
            <th>Total Cost</th>
        </tr>
    </ng-template>
    <ng-template #body let-order>
        <tr>
            <td>{{ order.id }}</td>
            <td>{{ order.movie }}</td>
            <td>{{ order.numTickets }}</td>
            <td>{{ order.cost }}</td>
        </tr>
    </ng-template>
</p-table>
</div>
