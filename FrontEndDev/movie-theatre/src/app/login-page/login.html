<div class="auth-page">

  <div class="auth-card">

    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue booking your movies</p>

    <div class="p-fluid">

      <div class="field">
        <input pInputText [(ngModel)]="email" placeholder="Email" />
      </div>

      <div class="field">
        <input pInputText type="password" [(ngModel)]="password" placeholder="Password" />
      </div>

      <button 
        pButton 
        type="button" 
        label="Login"
        [loading]="loading"
        (click)="login()">
      </button>

      <p *ngIf="error" class="error-text">{{ error }}</p>

      <div class="auth-switch">
        <p class="subtitle">Don't have an account?</p>
        <a routerLink="/register">Create Account</a>
      </div>

      <br>

      <div class="auth-switch">
        <p class="subtitle">Forgot your password?</p>
        <a routerLink="/password">Change your password</a>
      </div>

    </div>

  </div>

</div>
