<div class="auth-page">

  <div class="auth-card">

    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new password below</p>

    <div class="p-fluid">

      <!-- New Password -->
      <div class="field" style="position: relative;">
        <label>New Password <span style="color:red">*</span></label>

        <input pInputText [type]="showNewPassword ? 'text' : 'password'" [(ngModel)]="newPassword"
          placeholder="Enter new password" />

        <i class="pi" [ngClass]="showNewPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="toggleNewPassword()"
          style="position:absolute; right:10px; top:38px; cursor:pointer;">
        </i>
      </div>

      <!-- Confirm Password -->
      <div class="field" style="position: relative;">
        <label>Confirm Password <span style="color:red">*</span></label>

        <input pInputText [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword"
          placeholder="Re-enter password" />

        <i class="pi" [ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="toggleConfirmPassword()"
          style="position:absolute; right:10px; top:38px; cursor:pointer;">
        </i>
      </div>

      <!-- Validation Message -->
      <p *ngIf="newPassword && confirmPassword && newPassword !== confirmPassword" style="color:red; margin-top:5px;">
        Passwords do not match
      </p>

      <!-- BUTTON -->
      <button (click)="resetPassword()"
        [disabled]="isLoading || !newPassword || !confirmPassword || newPassword !== confirmPassword"
        style="margin-top:15px;">
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <!-- Error Message -->
      <p *ngIf="error" style="color:red; margin-top:15px;">
        {{ error }}
      </p>

      <!-- Success Message -->
      <p *ngIf="success" style="color:green; margin-top:15px; font-weight: bold;">
        {{ success }}
      </p>

      <p *ngIf="success" style="margin-top:10px;">
        Redirecting to login in {{ countdown }} seconds...
      </p>

      <p *ngIf="success" style="margin-top:10px;">
        <a routerLink="/login" style="color:#007bff; text-decoration:underline;">
          Click here if not redirected
        </a>
      </p>

    </div>

  </div>

</div>
